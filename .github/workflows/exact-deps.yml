name: Exact dependencies

# Builds docs/data.json with exact edges taken from Lean's compiled proof terms.
# The compiled proof (28.6 GB of .olean files) is streamed, never stored:
# files are read in batches and deleted, so a free runner's disk is enough.
# Run it by hand from the Actions tab.

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Jack McCarthy's published build of the original submission (Lean 4.33.1)
      OLEANS_URL: https://huggingface.co/datasets/JackMcCarthy/riemann-hypothesis-build/resolve/9036e64326acf4acfae159b96664e9708445c1d1/oleans.tar.zst
      SUBMISSION: 40e56bab
    steps:
      - uses: actions/checkout@v4
        with:
          path: explorer

      - name: Get the proof source (original submission)
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/leanprover-community/riemann-hypothesis rh
          git -C rh checkout "$SUBMISSION"
          git -C rh rev-parse HEAD > commit.txt
          cat rh/lean-toolchain
          df -h .

      - name: Install Lean 4.33.1
        run: |
          curl -sSfL https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst | tar --zstd -x
          echo "$PWD/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"

      - name: Check the extractor compiles
        run: lean --run explorer/extractor/ExtractOleans.lean /dev/null /dev/null

      - name: Stream the compiled proof and extract dependencies
        run: |
          python3 explorer/extractor/stream_extract.py "$OLEANS_URL" deps.tsv.gz \
            --lean "$(which lean)" --extractor explorer/extractor/ExtractOleans.lean \
            --workdir work --batch 4000 --jobs 3
          ls -la deps.tsv.gz
          df -h .

      - name: Index the source and build the site data
        run: |
          pip install numpy
          python3 explorer/indexer/index_lean.py rh/src data 4
          python3 explorer/indexer/exact_edges.py data deps.tsv.gz
          python3 explorer/indexer/dominators.py data
          python3 explorer/indexer/build_insights.py data
          python3 explorer/indexer/build_site_data.py data data.json "$(cat commit.txt)" 8000

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-deps
          path: |
            data.json
            deps.tsv.gz
          if-no-files-found: warn
          retention-days: 30
